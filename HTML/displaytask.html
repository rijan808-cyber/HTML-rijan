<!-- 
    Create a container class block with green background. The container block has 4 inline-block boxes with 100px height and width. Change the style of each box. Apply Red color as a background color with changing
    opacity box1: 0, box2: 0.25, box3: 0.5, box4: 0.5.
    Applyt border-radius for each boxes, box1: 0%, box2: 15%, box3: 25%, box4:50%
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: green;
            padding: 20px;
        }

        .box {
            display: inline-block;
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 10px;
        }

        .box1 {
            opacity: 0;
            border-radius: 0%;
        }

        .box2 {
            opacity: 0.25;
            border-radius: 15%;
        }

        .box3 {
            opacity: 0.5;
            border-radius: 25%;
        }

        .box4 {
            opacity: 0.5;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    <h1>Display Task</h1>
    <div class="container">
  <div class="box box1">box1</div>
  <div class="box box2">box2</div>
  <div class="box box3">box3</div>
  <div class="box box4">box4</div>
</div>

    </div>
</body>
</html>
