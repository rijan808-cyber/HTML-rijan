<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Create a jobapplicationfrom.html
     Create input fields for name, email, contact, address, cover letter, gender, skills,education(select-option), Company (input:text) and experience(select-option),province(select-option) and submit button
    -->
    <h1>Jobapplicationfrom</h1>
    <fieldset>
        <legend>Personal Information</legend>
    <form action="" method="post">
        <label for="name">Applicant name</label>
        <br>
        <input type="text" name="name" id="name" placeholder="Your Name" required>
        <br><br>
        <label for="email">Email Address</label>
        <br>
        <input type="email" name="email" id="email" placeholder="abc@gmail.com" required>
        <br><br>
        <label for="contact">Contact</label>
        <br>
        <input type="number" name="contact" id="contact" placeholder="Your number" size="10" required>
        <br><br>
        <label for="address">Address</label>
        <br>
        <input type="text" name="address" id="address" placeholder="Your Address" required>
        <br><br>
        <label for="cover-letter">Cover-letter</label><br>
        <textarea name="cover-letter" id="cover-letter" rows="10" cols="40"></textarea>
        <br><br>
        <label for="gender">Gender</label>
        <br>
        <input type="radio" name="Male" id="gender" value="Male">
        <label for="gender">Male</label>
        <input type="radio" name="Female" id="gender" value="Female">
        <label for="gender">Female</label>
        <input type="radio" name="Others" id="gender" value="Others">
        <label for="gender">Others</label>
        <br><br>
        <label for="skills">Skills</label>
        <br>
        <input type="checkbox" name="skills" id="python" value="python">
        <label for="python">Python</label>
        <br>
        <input type="checkbox" name="skills" id="database" value="database">
        <label for="database">Database</label>
        <br>
        <input type="checkbox" name="skills" id="CSS" value="CSS">
        <label for="CSS">CSS</label>
        <br>
        <input type="checkbox" name="skills" id="JS" value="JS">
        <label for="JS">JavaScript</label>
        <br>
        <input type="checkbox" name="skills" id="Networking" value="Networking">
        <label for="Networking">Networking</label>
        <br><br>
        <label for="education">Education</label>
        <select name="education" id="education">
            <option value="SLC/SEE">SLC/SEE</option>
            <option value="10+2/Diploma">10+2/Diploma</option>
            <option value="Bachelor Degree">Bachelor Degree</option>
            <option value="Masters Degree">Masters Degree</option>
            <option value="PhD">PhD</option>
        </select>
        <br><br>
        <label for="company">Past Company</label>
        <input type="text" name="company" id="company" placeholder="ABC Company">
        <br><br>
        <label for="experience">Experience</label>
        <select name="education" id="education">
            <option value="SLC/SEE">SLC/SEE</option>
            <option value="10+2/Diploma">10+2/Diploma</option>
            <option value="Bachelor Degree">Bachelor Degree</option>
            <option value="Masters Degree">Masters Degree</option>
            <option value="PhD">PhD</option>
        </select>
        <br><br>
        <label for="province">Province</label>
        <select name="province" id="province">
            <option value="Koshi">Koshi</option>
            <option value="Madesh">Madesh</option>
            <option value="Bagmati">Bagmati</option>
            <option value="Gandaki">Gandaki</option>
            <option value="Lumbini">Lumbini</option>
            <option value="Karnali">Karnali</option>
            <option value="Sudurpaschim">Sudurpaschim</option>
        </select>
        <br><br>
        <label for="cv">CV</label>
        <input type="file" name="cv" id="cv" multiple accept=" .png ." required>
        <br><br>
        <button type="submit"> Submit Applicant</button>
    </form>
    </fieldset>
</body>
</html>
