<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            background-color: green;
        }
        span{
            background-color: red;
        }
        .inline{
            display: inline;
            width: 500px;
            height: 500px;
        }
        .inline-block{
            display: inline-block;
            width: 500px;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Display</h1>

    <p class="ex1">
        <span> RCB </span>
        <span> MI </span>
        <span> KKR </span>
    </p>
    <!-- 
    Block level Tag vs Inline Tag
    Block level covers the space of a block.
    If the tag is block-level element then it appers in a new line.
    Example: div, h1, h2, h3, h4, h5, h6, p

    Inline Tag - covers the space of the element.
    If the tag is inline element then it appears in sameline.
    Example: img, span, input, etc.
    -->
    <hr>
    <h3>Inline</h3>
    <p class="inline">
        <span>Text 1</span>
        <span>Text 2</span>
        <span>Text 3</span>
    </p>
    <hr>
    <h3>Inline-Block</h3>
    <p class="inline-block">
        <span>Text 1</span>
        <span>Text 2</span>
        <span>Text 3</span>
    <hr>
    <h3>Block</h3>
    <hr>
    <h3>None</h3>
    <hr>

</body>
</html>
